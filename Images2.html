<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Clover Showcase</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      /* Combined: Ambient radial lights + rich background gradient */
      background: 
        radial-gradient(circle at 15% 20%, rgba(255, 75, 75, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 184, 0, 0.12) 0%, transparent 45%),
        linear-gradient(135deg, #090a0f 0%, #12161f 50%, #08090d 100%);
      background-attachment: fixed;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .card {
      /* Combined: Glassmorphic base + deep ambient drop shadows */
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        0 10px 20px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, #ff4b4b, #ffb800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(255, 75, 75, 0.3));
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .img-wrapper {
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #090d11;
      box-shadow: 
        0 10px 20px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  box-shadow 0.4s ease, 
                  border-color 0.4s ease;
    }

    .img-wrapper:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(255, 75, 75, 0.5);
      box-shadow: 
        0 20px 35px rgba(0, 0, 0, 0.8),
        0 0 25px rgba(255, 75, 75, 0.3);
    }

    .img-wrapper img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Black Clover — Volume 1</h1>
    <div class="gallery">
      <div class="img-wrapper">
        <img 
          src="Black_Clover,_volume_1.jpg" 
          alt="Black Clover Volume 1 Local Cover" 
          loading="lazy"
        />
      </div>
      <div class="img-wrapper">
        <img 
          src="https://chiranjivi-yadav.github.io/project-book2/Black_Clover,_volume_1.jpg" 
          alt="Black Clover Volume 1 Remote Cover" 
          loading="lazy"
        />
      </div>
    </div>
  </main>

</body>
</html>
