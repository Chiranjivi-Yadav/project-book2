<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Clover Showcase</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      /* Dynamic multi-layer gradient background with radial glows */
      background: 
        radial-gradient(circle at 15% 20%, rgba(255, 75, 75, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 184, 0, 0.12) 0%, transparent 45%),
        linear-gradient(135deg, #090a0f 0%, #12161f 50%, #08090d 100%);
      background-attachment: fixed;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .card {
      background: rgba(22, 27, 34, 0.75);
      /* Glassmorphism blur effect */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem;
